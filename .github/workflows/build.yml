# The one-step build, the same command a desk runs: elixir tools/build.exs.
# Cross-builds the guest ELFs, runs the host harnesses, and, with Godot on the
# runner, imports the project, bakes the native translations and runs the
# headless gates. No GPU on a runner: the rd paths are gated elsewhere.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A feature branch builds once, from its pull request. push only fires on
# main, so a branch with an open PR does not also get a push run: no duplicate
# checks. The group still coalesces the runs a single PR queues, and main keeps
# every run so each merge gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  GODOT_VERSION: 4.7.2
  SLANG_VERSION: 2026.13.1
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools from apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld llvm cmake ninja-build python3 spirv-tools xvfb
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: slangc and Godot
        run: |
          mkdir -p "$HOME/opt/slang" "$HOME/bin"
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" | tar -xz -C "$HOME/opt/slang"
          ln -sf "$HOME/opt/slang/bin/slangc" "$HOME/bin/slangc"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq godot.zip -d "$HOME/opt" && ln -sf "$HOME/opt/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Cache the riscv64 sysroot
        uses: actions/cache@v4
        with:
          path: build/riscv64-sysroot-src
          key: riscv64-sysroot-${{ hashFiles('build.sh') }}
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.6
      # Local-disk sccache, not the GHA backend: a GitHub cache outage makes
      # sccache's GHA storage fail every compile, but actions/cache failures
      # are non-fatal, so the build only loses the speedup, never breaks.
      - name: Cache sccache objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ github.ref_name }}-
            sccache-
      - name: Build
        env:
          COMPILER_LAUNCHER: sccache
        run: elixir tools/build.exs --gates=wrappers,curvenet
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Keep the ELFs, translations and gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            project/*.elf
            project/bintr/*.so
            gates/4-curvenet/results.txt
            gates/3-ggml-rd/ops/results-headless.txt
  # The GPU gates, on the macOS arm64 runner's GPU (Apple's paravirtual
  # Metal device). The vendored addon has no macOS library, so it is built
  # here from the org fork at the commit tools/godot-sandbox/CITATION.cff
  # names, plus the patches under tools/godot-sandbox (rule 1), and cached
  # on their hash. The guest ELFs come from the Linux job.
  gpu-macos:
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache the macOS addon
        id: addon
        uses: actions/cache@v4
        with:
          path: build/godot-sandbox-macos
          key: godot-sandbox-macos-${{ hashFiles('tools/godot-sandbox/**') }}
      - name: Build the addon (org fork + patches)
        if: steps.addon.outputs.cache-hit != 'true'
        run: |
          set -e
          BASE=$(awk '/^commit:/ {print $2}' tools/godot-sandbox/CITATION.cff)
          # Only the pinned commit: a full clone fails on macOS, whose disk is
          # case-insensitive, because the fork has a branch head/... next to HEAD.
          git init -q build/gs
          git -C build/gs remote add origin https://github.com/V-Sekai-fire/godot-sandbox.git
          git -C build/gs fetch -q --depth 1 origin "$BASE"
          git -C build/gs checkout -q FETCH_HEAD
          git -C build/gs submodule update -q --init --recursive
          # The fork's sources are CRLF and so is the patch (*.patch -text): keep the CRs.
          git -C build/gs -c user.name=ci -c user.email=ci@localhost am -q --keep-cr "$PWD"/tools/godot-sandbox/*.patch
          python -m pip install -q scons==4.4.0
          (cd build/gs && scons -j"$(sysctl -n hw.ncpu)" target=template_release platform=macos arch=universal precision=single)
          mkdir -p build/godot-sandbox-macos
          cp -R build/gs/bin/addons/godot_sandbox/bin/libgodot_riscv.macos.template_release.universal.framework build/godot-sandbox-macos/
      - name: Godot
        run: |
          cp -R build/godot-sandbox-macos/*.framework project/addons/godot_sandbox/bin/
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -oq godot.zip -d "$HOME/opt"
          echo "GODOT=$HOME/opt/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Import
        run: |
          "$GODOT" --path project --headless --import || true
      - name: GPU gates (Metal)
        run: |
          set -e
          system_profiler SPDisplaysDataType | head -20
          # Not --headless: a headless run has no RenderingDevice. With one,
          # the wrapper probe requires rd_probe to PASS.
          "$GODOT" --path project --rendering-driver metal --xr-mode off --script tests/probe_main_wrappers.gd
          "$GODOT" --path project --rendering-driver metal --xr-mode off --script gate_ggml_rd.gd
      - name: Skateboard (issue 5) - the wave, rendered 1920x1080 at 24 fps
        if: always()
        run: |
          set -e
          mkdir -p gates/skateboard
          "$GODOT" --path project --rendering-driver metal --xr-mode off \
            --write-movie ../gates/skateboard/wave.avi --fixed-fps 24 --resolution 1920x1080 \
            --script skateboard.gd -- --out=res://../gates/skateboard/results.txt
          ls -la gates/skateboard
      - name: Keep the gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-macos-${{ github.sha }}
          path: |
            gates/8-loop/wrappers.txt
            gates/3-ggml-rd/ops/
            gates/skateboard/
